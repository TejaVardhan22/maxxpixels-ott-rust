name: maxxpixels

x-go-common: &go-common
  image: maxxpixels-go-services:prod
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - .env
  networks:
    - maxx-net

services:
  # ============================================================================
  # Redis (runs inside Docker; PostgreSQL runs on the VPS host outside Docker)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: maxx-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - maxx-net

  # ============================================================================
  # Confluent Kafka (KRaft mode — no ZooKeeper required)
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: maxx-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - maxx-net

  # ============================================================================
  # Go Microservices (shared Alpine image built once by identity-service)
  # Connects to PostgreSQL on the VPS host via host.docker.internal:5432
  # ============================================================================
  identity-service:
    <<: *go-common
    build:
      context: ./services/go-api
      dockerfile: Dockerfile
    entrypoint: ["/app/identity-service"]
    container_name: maxx-identity
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 8081
      GO_ENV: ${GO_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      JWT_REFRESH_EXPIRATION_SECONDS: ${JWT_REFRESH_EXPIRATION_SECONDS:-2592000}
      SMS_PROVIDER: ${SMS_PROVIDER:-MSG91}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-MAXXPX}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}

  catalog-service:
    <<: *go-common
    entrypoint: ["/app/catalog-service"]
    container_name: maxx-catalog
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 8082
      GO_ENV: ${GO_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.maxxpixels.com}
      BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID:-}
      BUNNY_STREAM_API_KEY: ${BUNNY_STREAM_API_KEY:-}
      BUNNY_STREAM_CDN_HOSTNAME: ${BUNNY_STREAM_CDN_HOSTNAME:-}
      BUNNY_STREAM_TOKEN_AUTH_KEY: ${BUNNY_STREAM_TOKEN_AUTH_KEY:-}
      BUNNY_STORAGE_ZONE_NAME: ${BUNNY_STORAGE_ZONE_NAME:-}
      BUNNY_STORAGE_ZONE_PASSWORD: ${BUNNY_STORAGE_ZONE_PASSWORD:-}
      BUNNY_STORAGE_ENDPOINT: ${BUNNY_STORAGE_ENDPOINT:-}
      BUNNY_STORAGE_REGION: ${BUNNY_STORAGE_REGION:-}
      BUNNY_PULL_ZONE_DOMAIN: ${BUNNY_PULL_ZONE_DOMAIN:-}
      MEDIA_DIRECT_CDN: ${MEDIA_DIRECT_CDN:-false}
    volumes:
      - api_uploads:/app/uploads

  streaming-service:
    <<: *go-common
    entrypoint: ["/app/streaming-service"]
    container_name: maxx-streaming
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 8083
      GO_ENV: ${GO_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.maxxpixels.com}
      BUNNY_STREAM_CDN_HOSTNAME: ${BUNNY_STREAM_CDN_HOSTNAME:-}
      BUNNY_STREAM_TOKEN_AUTH_KEY: ${BUNNY_STREAM_TOKEN_AUTH_KEY:-}

  commerce-service:
    <<: *go-common
    entrypoint: ["/app/commerce-service"]
    container_name: maxx-commerce
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 8084
      GO_ENV: ${GO_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

  monetization-service:
    <<: *go-common
    entrypoint: ["/app/monetization-service"]
    container_name: maxx-monetization
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 8085
      GO_ENV: ${GO_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.maxxpixels.com}

  platform-service:
    <<: *go-common
    entrypoint: ["/app/platform-service"]
    container_name: maxx-platform
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 8086
      GO_ENV: ${GO_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      GAMES_DATABASE_URL: ${GAMES_DATABASE_URL:-}
      EXTRA_BACKUP_DATABASE_URLS: ${EXTRA_BACKUP_DATABASE_URLS:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.maxxpixels.com}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-MAXXPX}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-}
      BUNNY_STORAGE_ZONE_NAME: ${BUNNY_STORAGE_ZONE_NAME:-}
      BUNNY_STORAGE_ZONE_PASSWORD: ${BUNNY_STORAGE_ZONE_PASSWORD:-}
      BUNNY_STORAGE_ENDPOINT: ${BUNNY_STORAGE_ENDPOINT:-}
      BUNNY_STORAGE_REGION: ${BUNNY_STORAGE_REGION:-}
      BUNNY_PULL_ZONE_DOMAIN: ${BUNNY_PULL_ZONE_DOMAIN:-}
      DB_BACKUP_DIR: /app/backups
      DB_BACKUP_BUNNY_PREFIX: ${DB_BACKUP_BUNNY_PREFIX:-db-backups}
      DB_BACKUP_RETENTION_DAYS: ${DB_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - db_backups:/app/backups
      - /etc/maxxpixels/fcm-service-account.json:/etc/maxxpixels/fcm-service-account.json:ro

  worker-service:
    <<: *go-common
    entrypoint: ["/app/worker-service"]
    container_name: maxx-worker
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: 8087
      GO_ENV: ${GO_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      GAMES_DATABASE_URL: ${GAMES_DATABASE_URL:-}
      EXTRA_BACKUP_DATABASE_URLS: ${EXTRA_BACKUP_DATABASE_URLS:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-}
      BUNNY_STORAGE_ZONE_NAME: ${BUNNY_STORAGE_ZONE_NAME:-}
      BUNNY_STORAGE_ZONE_PASSWORD: ${BUNNY_STORAGE_ZONE_PASSWORD:-}
      BUNNY_STORAGE_ENDPOINT: ${BUNNY_STORAGE_ENDPOINT:-}
      BUNNY_STORAGE_REGION: ${BUNNY_STORAGE_REGION:-}
      BUNNY_PULL_ZONE_DOMAIN: ${BUNNY_PULL_ZONE_DOMAIN:-}
      DB_BACKUP_ENABLED: ${DB_BACKUP_ENABLED:-true}
      DB_BACKUP_DIR: /app/backups
      DB_BACKUP_BUNNY_PREFIX: ${DB_BACKUP_BUNNY_PREFIX:-db-backups}
      DB_BACKUP_RETENTION_DAYS: ${DB_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - db_backups:/app/backups
      - /etc/maxxpixels/fcm-service-account.json:/etc/maxxpixels/fcm-service-account.json:ro

  # ============================================================================
  # API Gateway (Go — exposes REST + GraphQL on :8081)
  # ============================================================================
  api:
    <<: *go-common
    entrypoint: ["/app/api-gateway"]
    container_name: maxx-api
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
      catalog-service:
        condition: service_started
      streaming-service:
        condition: service_started
      commerce-service:
        condition: service_started
      monetization-service:
        condition: service_started
      platform-service:
        condition: service_started
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8081"
    environment:
      PORT: 8081
      GO_ENV: ${GO_ENV:-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      STREAMING_SERVICE_URL: http://streaming-service:8083
      COMMERCE_SERVICE_URL: http://commerce-service:8084
      MONETIZATION_SERVICE_URL: http://monetization-service:8085
      PLATFORM_SERVICE_URL: http://platform-service:8086
      GAMES_SERVICE_URL: http://games:8090
      DISABLE_RATE_LIMIT: ${DISABLE_RATE_LIMIT:-false}
      RATE_LIMIT_GENERAL_PER_MINUTE: ${RATE_LIMIT_GENERAL_PER_MINUTE:-600}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-30}
      RATE_LIMIT_PAYMENT_PER_MINUTE: ${RATE_LIMIT_PAYMENT_PER_MINUTE:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://maxxpixels.com,https://www.maxxpixels.com,https://admin.maxxpixels.com,https://producer.maxxpixels.com}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      maxx-net:
        aliases:
          - api-gateway

  # ============================================================================
  # Games & Coins Microservice (Go — connects to separate host games DB)
  # ============================================================================
  games:
    <<: *go-common
    entrypoint: ["/app/games-service"]
    container_name: maxx-games
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GAMES_PORT:-8090}:8090"
    environment:
      GO_ENV: ${GO_ENV:-production}
      GAMES_SERVICE_PORT: 8090
      GAMES_DATABASE_URL: ${GAMES_DATABASE_URL}
      MAIN_API_URL: http://api:8081
      JWT_SECRET: ${JWT_SECRET}
      PLAYFORFUN_TENANT_ID: ${PLAYFORFUN_TENANT_ID:-maxxpixels}
      PLAYFORFUN_SECRET: ${PLAYFORFUN_SECRET:-}
      PLAYER_TTL_SECONDS: ${PLAYER_TTL_SECONDS:-86400}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://maxxpixels.com,https://www.maxxpixels.com}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${GAMES_RAZORPAY_WEBHOOK_SECRET:-${RAZORPAY_WEBHOOK_SECRET:-}}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      SUBSCRIPTION_GRANT_COINS: ${SUBSCRIPTION_GRANT_COINS:-1000}
      SUBSCRIPTION_MONTHLY_COINS: ${SUBSCRIPTION_MONTHLY_COINS:-100}
      COIN_PACKS: ${COIN_PACKS:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ============================================================================
  # Google Drive -> Bunny Stream Pipeline (Go zero-disk streaming service)
  # ============================================================================
  media-streamer:
    <<: *go-common
    entrypoint: ["/app/media-streamer", "-server", "-port=8085"]
    container_name: maxx-media-streamer
    ports:
      - "127.0.0.1:${STREAMER_PORT:-8085}:8085"
    environment:
      API_BACKEND_URL: http://api:8081
      BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID:-}
      BUNNY_STREAM_API_KEY: ${BUNNY_STREAM_API_KEY:-}
      BUNNY_STREAM_CDN_HOSTNAME: ${BUNNY_STREAM_CDN_HOSTNAME:-}
      GDRIVE_TOKEN_PATH: /app/data/token.json
      GDRIVE_CREDENTIALS_PATH: /app/credentials.json
      GDRIVE_REDIRECT_URI: ${GDRIVE_REDIRECT_URI:-}
    volumes:
      - ./services/media-streamer/credentials.json:/app/credentials.json:ro
      - streamer_data:/app/data

  # ============================================================================
  # Web Frontend (Next.js 14 standalone — REST + Go GraphQL)
  # ============================================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_BACKEND_URL: http://api:8081
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Maxxpixels}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_ADSENSE_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-GTM-NCD2C9GP}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-6Le3Di8uAAAAACkUTTU7cl19KOTyzt2zDzq0-VRS}
        NEXT_PUBLIC_EXTRA_IMAGE_HOSTS: ${NEXT_PUBLIC_EXTRA_IMAGE_HOSTS:-}
    container_name: maxx-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      API_BACKEND_URL: http://api:8081
    networks:
      - maxx-net

  # ============================================================================
  # Admin & Producer Console (React + Refine + Ant Design 6 + Nginx)
  # ============================================================================
  admin:
    build:
      context: ./apps/admin-refine
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${ADMIN_API_BASE_URL:-/api/v1}
    container_name: maxx-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_PORT:-4200}:80"
    networks:
      - maxx-net

networks:
  maxx-net:
    driver: bridge

volumes:
  redis_data:
  kafka_data:
  api_uploads:
  db_backups:
  streamer_data:
