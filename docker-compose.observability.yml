# Optional Observability Stack (Jaeger + Prometheus + Grafana)
# Run alongside docker-compose.go-local.yml:
#   docker compose -f docker-compose.go-local.yml -f docker-compose.observability.yml up -d
#
# UIs:
#   Jaeger Tracing : http://127.0.0.1:16686
#   Prometheus     : http://127.0.0.1:9090
#   Grafana        : http://127.0.0.1:3002

services:
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: maxx-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
      - "127.0.0.1:4318:4318"   # OTLP HTTP receiver
    networks:
      - maxx-go-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: maxx-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - maxx-go-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: maxx-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - jaeger
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${DB_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - maxx-go-net

volumes:
  prometheus_data:
  grafana_data:
