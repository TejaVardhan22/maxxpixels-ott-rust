# ==============================================================================
# MaxxPixels OTT — Host VPS Nginx Reference Configuration for Docker Stack
#
# Docker containers bind exclusively to 127.0.0.1:
#   - API (Rust):    127.0.0.1:8081
#   - Games (Rust):  127.0.0.1:8090
#   - Web (Next.js): 127.0.0.1:3001
#   - Admin (NG):    127.0.0.1:4200
#
# Keep your existing Certbot SSL blocks and update only the upstream/location
# directives to point at these local Docker ports.
# ==============================================================================

map $http_upgrade $maxx_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream maxx_api {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream maxx_games {
    server 127.0.0.1:8090;
    keepalive 16;
}

upstream maxx_web {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream maxx_admin {
    server 127.0.0.1:4200;
    keepalive 16;
}

# --- 1. API (api.maxxpixels.com) ----------------------------------------------
server {
    listen 80;
    server_name api.maxxpixels.com;
    client_max_body_size 500M;

    # Route PlayforFun & Coins endpoints to the standalone Rust games service
    location ^~ /api/v1/games/ {
        proxy_pass http://maxx_games;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://maxx_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $maxx_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# --- 2. Web Storefront (maxxpixels.com) ---------------------------------------
server {
    listen 80;
    server_name maxxpixels.com www.maxxpixels.com;
    client_max_body_size 500M;

    location ^~ /api/v1/games/ {
        proxy_pass http://maxx_games;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|uploads|storage|content|posters|banners|branding|notification|ads|socket\.io)(/|$) {
        proxy_pass http://maxx_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $maxx_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://maxx_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $maxx_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- 3. Admin & Producer Panel (admin.maxxpixels.com, producer.maxxpixels.com)
server {
    listen 80;
    server_name admin.maxxpixels.com producer.maxxpixels.com;
    client_max_body_size 500M;

    location / {
        proxy_pass http://maxx_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $maxx_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
