# Example only: retain the existing production TLS server block and certificate.
server {
    listen 80;
    server_name maxxpixels.com www.maxxpixels.com;
    client_max_body_size 500m;

    location ~ ^/(api|uploads|storage|content|posters|banners|branding|notification|ads|socket\.io)(/|$) {
        include /etc/nginx/snippets/maxxpixels-proxy-headers.conf;
        proxy_pass http://maxx_api;
    }

    location / {
        include /etc/nginx/snippets/maxxpixels-proxy-headers.conf;
        proxy_pass http://maxx_web;
    }
}
